services:
  trafikjam:
    build: .
    restart: unless-stopped
    environment:
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:?TOMTOM_API_KEY gerekli}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN gerekli}
      SECRET_KEY: ${SECRET_KEY:-}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      MAX_POINTS_PER_USER: ${MAX_POINTS_PER_USER:-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-300}
      YOGUN_ESIK: ${YOGUN_ESIK:-0.40}
      ORTA_ESIK: ${ORTA_ESIK:-0.70}
      TIMEZONE: ${TIMEZONE:-Europe/Istanbul}
    volumes:
      - trafikjam-data:/data
    expose:
      - "8000"

volumes:
  trafikjam-data:
